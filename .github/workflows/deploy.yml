name: Build and Deploy Next.js static site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce Pages build type = workflow (fail loudly)
        run: |
          set -e
          CODE=$(curl -sS -o /tmp/put.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> HTTP $CODE"; cat /tmp/put.json; echo
          STATE=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "$STATE"
          BT=$(echo "$STATE" | jq -r '.build_type // "unknown"')
          {
            echo "## Pages build_type enforcement"
            echo ""
            echo "- PUT /pages HTTP status: \`$CODE\`"
            echo "- Resulting build_type: \`$BT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != "204" ] && [ "$CODE" != "200" ]; then echo "::error::PUT /pages failed (HTTP $CODE)"; exit 1; fi
          if [ "$BT" != "workflow" ]; then echo "::error::build_type is '$BT', expected 'workflow'"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: next-portfolio/package-lock.json

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        working-directory: ./next-portfolio
        run: npm ci

      - name: Build
        working-directory: ./next-portfolio
        run: npm run build

      - name: Export static site
        working-directory: ./next-portfolio
        run: npm run export

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./next-portfolio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for any racing branch Pages build to finish
        run: |
          for i in $(seq 1 15); do
            BUSY=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=10" \
              | jq '[.workflow_runs[] | select(.name=="pages build and deployment" and .head_sha=="${{ github.sha }}" and .status!="completed")] | length')
            echo "attempt $i: in-flight dynamic builds = $BUSY"
            [ "$BUSY" = "0" ] && break
            sleep 12
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

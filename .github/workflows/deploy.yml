name: Build and Deploy Next.js static site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: next-portfolio/package-lock.json

      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Force Pages build type to workflow (remove stale branch source)
        run: |
          code=$(curl -sS -o /tmp/pages-resp.txt -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages -> HTTP $code"
          cat /tmp/pages-resp || true
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::Could not force build_type (HTTP $code) — deploy-pages may fail if source is branch-based"
          fi

      - name: Install dependencies
        working-directory: ./next-portfolio
        run: npm ci

      - name: Build
        working-directory: ./next-portfolio
        run: npm run build

      - name: Export static site
        working-directory: ./next-portfolio
        run: npm run export

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./next-portfolio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
